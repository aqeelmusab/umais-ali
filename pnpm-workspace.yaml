packages:
  - "."

# Force the patched esbuild (GHSA-gv7w-rqvm-qjhr, GHSA-g7r4-m6w7-qqqr).
# tsx pulls esbuild ~0.28.0, which 0.28.1 satisfies.
# Force the patched path-to-regexp (GHSA-9wv6-86v2-598j, ReDoS), pulled in
# transitively by @astrojs/vercel -> @vercel/routing-utils.
# Force the patched nanoid (indefinite loop with zero size), pulled in
# transitively by vite (via astro/@astrojs/svelte/@tailwindcss/vite).
# Force the patched postcss (arbitrary .map file disclosure via
# sourceMappingURL), pulled in transitively by vite.
# Force the patched fast-uri (host confusion via backslash authority
# delimiter), pulled in transitively by @astrojs/check -> yaml-language-server -> ajv.
overrides:
  esbuild: "~0.28.1"
  path-to-regexp@<6.3.0: "^6.3.0"
  nanoid: "^3.3.18"
  postcss: "^8.5.23"
  fast-uri: "^3.1.5"

allowBuilds:
  "@biomejs/biome": true
  "@parcel/watcher": true
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@biomejs/*'
  - '@types/node@24.13.3'
  - resend@6.17.2 || 6.18.1 || 6.24.0 || 6.27.0 || 6.28.1
  - tsx@4.23.1
  - '@astrojs/markdown-satteri@0.3.4 || 0.3.5'
  - astro@7.0.8 || 7.0.9 || 7.1.1 || 7.1.5 || 7.2.8
  - '@astrojs/vercel@11.0.3 || 11.0.4'
  - svelte@5.56.6
  - '@astrojs/internal-helpers@0.10.2'
  - framer-motion@12.43.0 || 13.3.0
  - motion-dom@12.43.0 || 13.3.0
  - motion@12.43.0 || 13.3.0
  - '@img/sharp-darwin-arm64@0.35.4'
  - '@img/sharp-darwin-x64@0.35.4'
  - '@img/sharp-freebsd-wasm32@0.35.4'
  - '@img/sharp-libvips-darwin-arm64@1.3.3'
  - '@img/sharp-libvips-darwin-x64@1.3.3'
  - '@img/sharp-libvips-linux-arm64@1.3.3'
  - '@img/sharp-libvips-linux-arm@1.3.3'
  - '@img/sharp-libvips-linux-ppc64@1.3.3'
  - '@img/sharp-libvips-linux-riscv64@1.3.3'
  - '@img/sharp-libvips-linux-s390x@1.3.3'
  - '@img/sharp-libvips-linux-x64@1.3.3'
  - '@img/sharp-libvips-linuxmusl-arm64@1.3.3'
  - '@img/sharp-libvips-linuxmusl-x64@1.3.3'
  - '@img/sharp-linux-arm64@0.35.4'
  - '@img/sharp-linux-arm@0.35.4'
  - '@img/sharp-linux-ppc64@0.35.4'
